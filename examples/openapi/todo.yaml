openapi: 3.0.3
info:
  title: Todo API
  version: "1.0.0"
  description: A tiny example API used by the Plexus quickstart.
servers:
  - url: http://127.0.0.1:7100
paths:
  /todos:
    get:
      operationId: listTodos
      summary: List todos
      responses:
        "200":
          description: A list of todos
    post:
      operationId: createTodo
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: What needs to be done
              required: [title]
      responses:
        "201":
          description: The created todo
  /todos/{id}:
    get:
      operationId: getTodo
      summary: Get a single todo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The todo
