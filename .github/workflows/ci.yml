name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: End-to-end smoke test
        env:
          DATA_DIR: ./.tmp/ci
          PLEXUS_ADMIN_PASSWORD: ci-password-123
          PORT: "3100"
          LOG_LEVEL: silent
          MODEL_PROVIDER: stub
        run: |
          node examples/mock-api.mjs &
          node apps/server/dist/index.js &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/healthz > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json

          BASE_URL=http://127.0.0.1:3100 \
          MOCK_API_URL=http://127.0.0.1:7100 \
          PLEXUS_ADMIN_PASSWORD=ci-password-123 \
          node scripts/smoke.mjs

      - name: Docker build
        run: docker build -t plexus:ci .
