name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: Plexus deliberately stays single-user and single-process.
      options:
        - label: This does not require multi-tenancy, RBAC, or SSO
        - label: This does not require a second datastore or a job queue
